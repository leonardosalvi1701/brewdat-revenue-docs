# Revisor tecnico
# Objetivo: nada e afirmado sem lastro e nada contradiz decisao vigente.
# Custo do erro: um par tecnico identifica a falha e a credibilidade do trabalho cai.
# Vies deliberado: prefere manter precisao a facilitar leitura.

agente: revisor-tecnico
saida: estruturada

metricas:
  - id: numeros_rastreaveis
    descricao: "Toda afirmacao numerica aponta para notebook, experimento, card ou dossie"
    alvo: 1.0
    bloqueante: true

  - id: conflito_com_adr
    descricao: "Nenhuma afirmacao contradiz ADR de status 'vigente'"
    alvo: 0
    bloqueante: true
    como_medir: "cruzar com decisions/_index.yaml"

  - id: notacao_consistente
    descricao: "Notacao matematica uniforme"
    alvo: 1.0
    bloqueante: true
    simbolos: ["beta_1", "gamma", "epsilon", "d", "u", "P(d)", "Qmin", "V0"]

  - id: grao_e_janela
    descricao: "Toda afirmacao empirica declara grao e janela temporal"
    alvo: 1.0
    bloqueante: true
    nota: "grao canonico: cod_unb x cod_pdv x cod_abrev_prod x id_menu"

  - id: qualificadores_summer
    descricao: "Numero do Summer citado com anchor_depth_pct e distincao E versus r"
    alvo: 1.0
    bloqueante: true

  - id: nomes_de_sistema_rastreaveis
    descricao: "Todo nome de sistema ou produto citado bate com o card, tag, area path ou glossario de origem, nunca inferido por familiaridade"
    alvo: 1.0
    bloqueante: true
    como_medir: "cruzar cada nome de sistema citado no texto contra Title/Tags/AreaPath do card fonte, ou config/glossario.yaml"
    nota: "categoria aberta apos review-log/2026-09-09-sprint-review-S4-Q3-26-REVENUE-DI-alice.md (Otimizador de Volume citado no lugar de Otimizador de Cobertura)"

  - id: causalidade_declarada
    descricao: "Alegacao causal so onde ha desenho causal; correlacional declarado como tal"
    alvo: 1.0
    bloqueante: true
    nota: "beta_1 vem de experimento randomizado; features de perfil vem de historico"

  - id: reprodutibilidade
    descricao: "Resultado apresentado indica como reproduzi-lo"
    alvo: 1.0
    bloqueante: false

  - id: frentes_e_etapas_rastreaveis
    descricao: "Cada bloco permanece associado ao produto, modelo e etapa corretos, sem fundir produtos diferentes por compartilharem framework"
    alvo: 1.0
    bloqueante: true
    como_medir: "cruzar atividade, card e produto; distinguir migracao de modelo existente, produtizacao de outro modelo, suporte e documentacao"

  - id: status_temporal_rastreavel
    descricao: "Cards transbordados mostram o estado no fechamento da sprint e distinguem atualizacoes posteriores"
    alvo: 1.0
    bloqueante: true
    como_medir: "confirmar comentario datado ate o fim da sprint, fonte do estado posterior e snapshots adicionais no frontmatter"

  - id: imagem_com_fonte_correta
    descricao: "Imagens estao ligadas a atividade de origem e foram conferidas visualmente"
    alvo: 1.0
    bloqueante: true
    como_medir: "conferir anexo, comentario, produto/DAG visivel e legenda; sem imagens, nao se aplica"

  - id: limitacoes_declaradas
    descricao: "Secao de limitacoes presente e especifica"
    alvo: 1.0
    bloqueante: false

veredito:
  aprovado: "nenhuma metrica bloqueante violada"
  revisar: "ate duas violacoes bloqueantes"
  reescrever: "tres ou mais violacoes bloqueantes"

conflito_com_negocio:
  # onde as duas rubricas se opoem, o humano arbitra. O sistema nao resolve sozinho.
  pontos_de_tensao:
    - "revisor-negocio quer cortar formula, revisor-tecnico exige formula"
    - "revisor-negocio quer simplificar ressalva, revisor-tecnico exige a ressalva"
    - "revisor-negocio quer teto de 10 paginas, revisor-tecnico quer detalhe completo"
  resolucao: >
    Paper de negocio segue a rubrica de negocio, paper tecnico segue a tecnica.
    O mesmo conteudo existe nas duas versoes com profundidade diferente. Onde
    ainda houver conflito, o autor arbitra: o sistema nao decide.
