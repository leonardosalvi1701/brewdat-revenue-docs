# Configuracao da squad. Nada de segredo aqui, segredos ficam no .env
#
# Os estados e tipos abaixo foram conferidos contra os cards reais das sprints
# S2 e S3 do Q3/26 em 28/08/2026, e os estados de saida em 31/08/2026,
# reconferidos contra S3 e S4 em 08/09/2026 com a sprint S4 em andamento. O
# projeto usa processo customizado da Ambev, nao o Scrum padrao do Azure
# DevOps: nao existem os estados New, Approved, Committed, In Progress nem
# Ready for Validation.
#
# O processo tambem nao e consistente dentro do proprio board: In-QA e
# Waiting-QA convivem como nomes diferentes para o mesmo conceito ("com QA"),
# sem regra clara de qual tipo de work item usa qual (a amostra de S3+S4 e
# pequena demais para afirmar uma regra: 1 card em Waiting-QA, 2 em In-QA).
# Antes de tratar uma string nova como estado novo, checar se nao e so mais
# um sinonimo do que ja existe.

squad:
  nome: Revenue
  produto: Revenue Docs

# Identificadores pessoais para conferir a conta usada em cada ferramenta.
# Preencha no seu clone antes de rodar scripts/preparar_ambiente.sh.
# Estes valores nao sao segredos; nao inclua tokens, senhas ou chaves aqui.
usuarios:
  azure: "PREENCHER_EMAIL_DA_CONTA_AZURE" # exemplo: leonardo.salvi@ambevtech.com.br
  databricks: "PREENCHER_EMAIL_DO_USUARIO_DATABRICKS" # exemplo: leonardo.salvi@ambevtech.com.br
  github: "PREENCHER_LOGIN_DO_GITHUB" # exemplo: leonardosalvi1701
  devops_email: "PREENCHER_EMAIL_DO_AZURE_DEVOPS" # exemplo: leonardo.salvi@ambevtech.com.br
  git_email: "PREENCHER_EMAIL_DO_GIT" # exemplo: leonardo.salvi@ambevtech.com.br

devops:
  # Onde o board vive. Nao e segredo: sai da url do board e e igual para toda a
  # squad, entao mora aqui e nao no .env de cada um. As variaveis de ambiente
  # AZDO_ORG_URL, AZDO_PROJECT e AZDO_TEAM continuam valendo e tem precedencia,
  # para quem precisa apontar para outro time sem editar arquivo versionado.
  org_url: https://dev.azure.com/AMBEV-SA
  project: AMBEV-ANALYTICS-DATA-CHAPTER-SALES
  # nome do time como aparece no board, com espacos. O codigo codifica a url.
  team: Squad Revenue DI

  # tipos de work item que a squad usa. O executor recusa criar card de tipo
  # fora desta lista, mesmo com aprovacao humana.
  tipos: [Technical Story, Analysis Activity, Business Story, Bug, Action]

  # o card sai da mao da squad e fica esperando acao de terceiro: QA (que
  # aparece como Waiting-QA num tipo de work item e In-QA noutro, mesmo
  # conceito) ou liberacao em producao (Waiting-Production). E o estado que
  # a secao "Em validacao" da sprint review descreve: entrega feita da parte
  # da squad, aceite ou deploy pendente de terceiro. Conferido contra os
  # cards da S3 e da S4-Q3-26 em 08/09/2026.
  estados_validacao: [Waiting-QA, In-QA, Waiting-Production]

  # entregue de fato, aceite incluido. Alimenta a secao "Entregue" da sprint
  # review. Nada em estados_validacao entra aqui: trabalho concluido pela
  # squad, sim, mas quem fecha e o terceiro, e a review precisa mostrar a
  # diferenca.
  estados_concluidos: [Done]

  # Refinement-Done e o equivalente, em Business Story, do Waiting-Development
  # de Technical Story: refino terminado, desenvolvimento ainda nao comecou.
  # Confirmado contra os dois cards com esse estado na S4-Q3-26 em 08/09/2026,
  # nenhum dos dois com comentario ou entrega registrada.
  estados_ativos: [In-Refinement, Waiting-Development, Developing, Refinement-Done]

  # transicoes que o executor tem permissao de aplicar, mesmo aprovadas.
  # Lista conservadora: cobre so o avanco natural do refinamento ate o
  # desenvolvimento. O grafo oficial de transicoes do processo ainda nao foi
  # confirmado com o time de processo, entao qualquer transicao fora daqui
  # continua bloqueada por omissao, que e o comportamento seguro.
  transicoes_permitidas:
    - [In-Refinement, Waiting-Development]
    - [Waiting-Development, Developing]

  # transicoes que NUNCA sao aplicadas por automacao, nem aprovadas.
  # Fechar card e decisao humana feita na interface do DevOps.
  transicoes_bloqueadas:
    - [Waiting-QA, Done]
    - [In-QA, Done]
    - [Waiting-Production, Done]
    - [Developing, Done]
    - [Waiting-Development, Done]
    - [In-Refinement, Done]
    - [Refinement-Done, Done]

github:
  repos:
    - BrewDat/brewdat-saz-saz-sales-revenue-promophoenix-volume-mlp
  # janela padrao de coleta de commits, em dias
  janela_dias: 14

databricks:
  # Nome unico do perfil SSO em ~/.databrickscfg. O setup cria ou autentica
  # exatamente este perfil; todo o codigo usa este valor como fonte de verdade.
  perfil: revenue
  # Cada pessoa tem a propria pasta revenue-docs dentro da sua area no
  # workspace, e nao existe caminho compartilhado: {usuario} e trocado, na
  # hora, pelo login de quem esta autenticado.
  # caminhos lidos pelo inventario de notebooks
  paths:
    - /Workspace/Users/{usuario}/revenue-docs
  # notebooks so podem ser escritos dentro destes prefixos. E a mesma pasta da
  # leitura, e {usuario} e sempre quem aplica: ninguem escreve na pasta de
  # outra pessoa.
  escrita_permitida:
    - /Workspace/Users/{usuario}/revenue-docs/escritos

gate:
  # exige aprovacao explicita para toda escrita externa. Nao desligavel por config.
  exigir_aprovacao: true
  # aprovador precisa se identificar ao aprovar
  exigir_identificacao: true

formato:
  data: "%d/%m/%Y"
  paper_negocio_max_paginas: 10
