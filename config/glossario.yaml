# Vocabulario canonico. O revisor de negocios valida contra este arquivo.
# Regra: um conceito, um termo. Sinonimos sao erro, nao estilo.

termos:
  probabilidade_de_conversao:
    canonico: "probabilidade de conversao"
    definicao: "chance de o PDV aceitar a promocao e comprar o minimo exigido"
    proibidos: ["taxa de aceite", "chance de compra", "propensao", "conversion rate"]
    publico: ambos

  probabilidade_de_compra:
    canonico: "probabilidade de compra"
    definicao: "saida do modelo ps_purchase_probability: chance de o PDV comprar o brand pack no mes, com ou sem promocao. Nao varia com desconto nem com Qmin"
    proibidos: ["chance de compra", "propensao de compra"]
    publico: ambos
    nota: >
      Outro evento, de outro time, nao sinonimo de probabilidade de conversao.
      Definido no notebook 30, lido em 08/10/2026. Ver ADR-0014.

  fora_do_tempo:
    canonico: "fora do tempo"
    definicao: "medido em meses posteriores ao ultimo mes usado no ajuste, com parametros congelados no ajuste"
    proibidos: ["out-of-time (em texto de negocio)"]
    publico: ambos
    nota: "em paper tecnico, 'OOT' e aceito depois da primeira ocorrencia por extenso"

  esforco_solicitado:
    canonico: "esforco solicitado"
    definicao: "distancia entre o Qmin e o volume normal de compra do PDV"
    proibidos: ["uplift exigido (em texto de negocio)", "esforco pedido", "exigencia"]
    publico: ambos
    nota: "em paper tecnico, 'uplift exigido' e aceito junto da formula"

  dificuldade:
    canonico: "dificuldade"
    definicao: "combinacao entre esforco solicitado e desconto oferecido"
    proibidos: ["complexidade", "barreira", "atrito"]
    publico: ambos

  elasticidade:
    canonico: "elasticidade"
    definicao: "variacao percentual na probabilidade de conversao dividida pela variacao percentual no desconto"
    exige_formula: true
    exige_ponte_classica: true
    publico: ambos

  estimador_de_roi:
    canonico: "estimador de ROI"
    definicao: "trava de eficiencia que relaciona uplift exigido e desconto concedido"
    proibidos: ["ROI", "retorno", "lucro"]
    publico: ambos
    nota: "nunca 'ROI' sozinho: e trava de eficiencia, nao estimativa de lucro. O retorno medido em experimento tem tres termos proprios, sempre qualificados: ROI tecnico ajustado, ROI tecnico de Revenue e ROI do dashboard"

  qmin:
    canonico: "Qmin"
    definicao: "quantidade minima de caixas recomendada pelo Otimizador de Volume 1.0"
    publico: ambos

  otimizador_de_cobertura:
    canonico: "Otimizador de Cobertura"
    definicao: "sistema de recomendacao de cobertura da squad, distinto do Otimizador de Volume 1.0 que gera o Qmin"
    proibidos: ["Otimizador de Volume", "modelo de volume"]
    publico: ambos
    nota: >
      Esboco minimo: confundido com o Otimizador de Volume no rascunho de
      09/09/2026 (review-log/2026-09-09-sprint-review-S4-Q3-26-REVENUE-DI-alice.md).
      Definicao completa ainda por confirmar com a squad.

  # Leitura de experimento de desconto. Registrados em 09/11/2026, a partir do
  # experimento de outubro de 2026. Ver ADR-0016.

  grupo_de_tratamento:
    canonico: "grupo de tratamento"
    definicao: "PDVs sorteados para receber o desconto do modelo"
    proibidos: ["braco", "braco de tratamento", "tratados"]
    publico: ambos

  grupo_de_controle:
    canonico: "grupo de controle"
    definicao: "PDVs sorteados para receber a pratica, sem o desconto do modelo"
    proibidos: ["braco", "braco de controle"]
    publico: ambos

  pratica:
    canonico: "pratica"
    definicao: "o desconto que o par receberia sem o modelo de desconto, dado pelo motor de volume; e o que o grupo de controle recebe"
    publico: ambos
    nota: "em texto de negocio, 'desconto da pratica' na primeira ocorrencia"

  cesta:
    canonico: "cesta"
    definicao: "conjunto de pares PDV x SKU escolhidos para receber a promocao no experimento"
    publico: ambos

  linha_de_base:
    canonico: "linha de base"
    definicao: "venda que o par teria sem a promocao, estimada pelo proprio passado; a janela depende da regua do ROI"
    proibidos: ["baseline (em texto de negocio)"]
    publico: ambos

  uplift:
    canonico: "uplift"
    definicao: "variacao percentual da venda do periodo contra a linha de base"
    publico: ambos
    nota: "dizer sempre de que: uplift de volume ou uplift de faturamento, e contra qual linha de base"

  roi_tecnico_ajustado:
    canonico: "ROI tecnico ajustado"
    definicao: "faturamento a mais do grupo de tratamento sobre o de controle, por regressao por par ajustada pela compra antes da selecao, dividido pelo gasto a mais"
    exige_formula: true
    publico: ambos
    nota: "so existe na diferenca entre os grupos; responde quanto o desconto do modelo rendeu a mais que a pratica"

  roi_tecnico_de_revenue:
    canonico: "ROI tecnico de Revenue"
    definicao: "uplift de faturamento contra a media dos mesmos pares no mesmo dia da semana nas 12 semanas antes do inicio, dividido pelo gasto"
    exige_formula: true
    publico: ambos

  roi_do_dashboard:
    canonico: "ROI do dashboard"
    definicao: "KPI de eficiencia de volume da area: crescimento do faturamento contra os 110 dias anteriores menos o do cluster de PDVs parecidos, ponderado pela fatia da iniciativa no desconto, dividido pelo investimento, mais 1"
    publico: ambos
    nota: "o nivel nao e efeito (o teste placebo tambem sai alto); so a diferenca entre os grupos se compara"

  custo_por_conversao:
    canonico: "custo por conversao"
    definicao: "gasto em desconto dividido pelo numero de conversoes do grupo"
    publico: ambos

  manutencao_das_conversoes:
    canonico: "manutencao das conversoes"
    definicao: "parte do gasto do grupo de tratamento que pagaria, no desconto da pratica, as conversoes que aconteceriam de qualquer forma"
    exige_formula: true
    publico: ambos

  gasto_a_mais_em_desconto:
    canonico: "gasto a mais em desconto"
    definicao: "parte do gasto do grupo de tratamento que paga desconto maior as mesmas conversoes que aconteceriam com a pratica; verba sem conversao a mais"
    exige_formula: true
    publico: ambos
    nota: "nas figuras do paper de outubro de 2026 aparece como 'dose a mais'; em texto novo, usar o canonico"

  conversoes_novas:
    canonico: "conversoes novas"
    definicao: "parte do gasto do grupo de tratamento paga aos pares que so converteram por causa do desconto do modelo"
    exige_formula: true
    publico: ambos

  data_de_leitura:
    canonico: "data de leitura"
    definicao: "data fixa ate a qual as notas entram na leitura de um experimento; leitura parcial antes do fim da vigencia, leitura final depois dele, com as notas maduras"
    publico: ambos
    nota: "a aderencia registra compra com atraso de 2 a 5 dias; leitura sem data fixa muda de numero a cada execucao"

  ponto_de_melhoria:
    canonico: "Ponto"
    definicao: "melhoria proposta a partir de um resultado, apresentada com problema, evidencia e solucao"
    proibidos: ["ficha"]
    publico: ambos

enquadramentos_obrigatorios:
  summer: >
    O Summer estabeleceu a fundacao. Ao construir sobre ela identificamos
    limitacoes naturais de escopo, quase todas declaradas pelo proprio sistema,
    e desenvolvemos estrategias de contorno. Nunca critica a viabilidade ou ao
    impacto do projeto do Eduardo.
  boxplot: >
    Mudanca de escopo da avaliacao do grafico. Nunca "erro anterior", porque a
    abordagem original nao tinha documentacao que permitisse confirmar intencao.

proibicoes_absolutas:
  - id: proposta_dez_2025
    regra: "A proposta de dezembro de 2025 (bootstrap ponderado) nao entra no corpo de nenhum paper. E ponto de fala verbal apenas."
  - id: em_dash_prosa
    regra: "Sem travessao em prosa corrida. Use virgula, dois pontos ou parenteses. Permitido apenas em itemizacao."
  - id: numero_summer_sem_qualificador
    regra: "Nenhum numero do Summer citado sem anchor_depth_pct e sem distinguir E de r."
